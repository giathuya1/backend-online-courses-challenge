services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: online_courses
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d online_courses"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 5000
      DATABASE_URL: postgres://app:app@db:5432/online_courses
      JWT_SECRET: dev_secret_change_me
      TZ: Asia/Ho_Chi_Minh
      # Thêm 3 dòng này:
      EMAIL_USER: giathuylk2005@gmail.com
      EMAIL_PASSWORD: jtawnedojtnd sady
      EMAIL_FROM: "Online Learning <giathuylk2005@gmail.com>"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata: