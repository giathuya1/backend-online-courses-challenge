<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div id="app-navbar"></div>

  <main class="container py-4 app-shell">
    <div class="page-title mb-3">
      <div>
        <h1 class="h3">Dashboard</h1>
        <div class="text-muted">Shortcuts based on your role</div>
      </div>
      <a class="btn btn-outline-secondary" href="/home.html">Home</a>
    </div>

    <div id="content" class="row g-3"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async function () {
      await DemoUI.mountNavbar();

      if (!DemoApi.getToken()) {
        location.href = '/auth-login.html?next=' + encodeURIComponent('/dashboard.html');
        return;
      }

      const profile = await DemoApi.apiFetch('/api/auth/profile', { method: 'GET' });
      const role = profile?.data?.roles?.[0] || null;

      const content = document.getElementById('content');

      function tile(title, desc, href) {
        const col = document.createElement('div');
        col.className = 'col-md-6 col-lg-4';
        col.innerHTML = `
          <div class="card card-soft h-100">
            <div class="card-body">
              <div class="fw-semibold">${title}</div>
              <div class="text-muted small mt-1">${desc}</div>
              <a class="btn btn-dark btn-sm mt-3" href="${href}">Open</a>
            </div>
          </div>`;
        return col;
      }

      content.appendChild(tile('Profile', 'View user info.', '/profile.html'));
      content.appendChild(tile('Swagger', 'Test APIs quickly.', '/api/docs'));

      if (role === 'admin') content.appendChild(tile('Admin: Roles', 'Assign roles.', '/admin/roles.html'));
      if (role === 'instructor' || role === 'admin') {
        content.appendChild(tile('Instructor: Courses', 'Manage courses.', '/instructor/courses.html'));
        content.appendChild(tile('Instructor: Classes', 'Manage classes.', '/instructor/classes.html'));
      }
      if (role === 'student' || role === 'admin') content.appendChild(tile('Student: Enroll', 'Enroll and view enrollments.', '/student/enroll.html'));
    })().catch(err => {
      document.getElementById('content').innerHTML = `<pre>${err.message}</pre>`;
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
