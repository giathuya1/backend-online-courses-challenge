<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div id="app-navbar"></div>

  <main class="container py-5 app-shell">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card card-soft">
          <div class="card-body p-4">
            <h1 class="h4 mb-1">Sign in</h1>
            <div class="text-muted mb-3">Use email or username.</div>

            <div class="mb-3">
              <label for="email" class="form-label">Email / Username</label>
              <input id="email" class="form-control" placeholder="admin.demo@example.com" autocomplete="username" />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input id="password" type="password" class="form-control" placeholder="test01" autocomplete="current-password" />
            </div>

            <button id="btnLogin" class="btn btn-primary w-100">Login</button>

            <pre id="out" class="bg-light p-3 rounded small mt-3 mb-0" style="min-height:84px;"></pre>

            <div class="text-muted small mt-3">
              After login go to <a href="/dashboard.html">Dashboard</a>.
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    DemoUI.mountNavbar();

    const out = document.getElementById('out');
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/dashboard.html';

    document.getElementById('btnLogin').addEventListener('click', async () => {
      out.textContent = 'Logging in...';
      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const r = await DemoApi.apiFetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        const token = r?.data?.access_token;
        if (!token) throw new Error('No access_token returned');

        DemoApi.setToken(token);
        location.href = next;
      } catch (e) {
        out.textContent = JSON.stringify({ error: e.message, status: e.status, payload: e.payload }, null, 2);
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
