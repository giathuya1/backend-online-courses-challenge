<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Online Learning System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 100%;
    }
    h1 { margin-bottom: 30px; color: #333; text-align: center; }
    .profile-item {
      margin-bottom: 20px;
      padding: 15px;
      background-color: #f5f5f5;
      border-radius: 8px;
    }
    .profile-label { color: #666; font-weight: 600; font-size: 14px; }
    .profile-value { color: #333; font-size: 18px; margin-top: 5px; font-weight: 500; }
    button {
      width: 100%;
      padding: 12px;
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover { background-color: #c62828; }
    .error {
      color: #d32f2f;
      margin-top: 10px;
      padding: 12px;
      background-color: #ffebee;
      border-radius: 8px;
      display: none;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>👤 My Profile</h1>
    <div id="profileContainer"></div>

    <!-- no inline onclick -->
    <button id="logoutBtn">Logout</button>

    <div id="error" class="error"></div>
  </div>

  <!-- CSP-safe external script -->
  <script src="/js/profile.js" defer></script>
</body>
</html>
