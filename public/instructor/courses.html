<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instructor - Courses</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div id="app-navbar"></div>

  <main class="container py-4 app-shell">
    <div class="page-title mb-3">
      <div>
        <h1 class="h3">Courses</h1>
        <div class="text-muted">Create & manage courses (instructor/admin)</div>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary" href="/dashboard.html">Dashboard</a>
        <button id="btnRefresh" class="btn btn-primary">Refresh</button>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-5">
        <div class="card card-soft">
          <div class="card-header fw-semibold">Create course</div>
          <div class="card-body">
            <div class="mb-2">
              <label class="form-label" for="title">Title</label>
              <input id="title" class="form-control" value="New Course Demo" />
            </div>
            <div class="mb-2">
              <label class="form-label" for="description">Description</label>
              <textarea id="description" class="form-control" rows="4">Course description...</textarea>
            </div>
            <div class="mb-2">
              <label class="form-label" for="status">Status</label>
              <select id="status" class="form-select" title="Status">
                <option value="draft">draft</option>
                <option value="published">published</option>
              </select>
            </div>

            <button id="btnCreate" class="btn btn-dark">Create</button>
            <pre id="createOut" class="bg-light p-3 rounded small mt-3 mb-0"></pre>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card card-soft">
          <div class="card-header fw-semibold">List courses</div>
          <div class="card-body">
            <div id="list" class="table-responsive"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async function () {
      await DemoUI.mountNavbar();
      await DemoUI.requireRole(['instructor', 'admin']);

      const list = document.getElementById('list');
      const createOut = document.getElementById('createOut');

      async function refresh() {
        list.innerHTML = '<div class="text-muted">Loading...</div>';
        const r = await DemoApi.apiFetch('/api/courses?page=1&limit=50', { method: 'GET' });
        const courses = r?.data?.courses || [];

        const rows = courses.map(c => `
          <tr>
            <td class="mono">${c.id}</td>
            <td>${c.title}</td>
            <td class="text-muted small">${c.status || ''}</td>
          </tr>
        `).join('');

        list.innerHTML = `
          <table class="table table-sm align-middle">
            <thead><tr><th>ID</th><th>Title</th><th>Status</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="3" class="text-muted">No data</td></tr>'}</tbody>
          </table>`;
      }

      document.getElementById('btnRefresh').addEventListener('click', () => refresh().catch(console.error));

      document.getElementById('btnCreate').addEventListener('click', async () => {
        createOut.textContent = 'Creating...';
        try {
          const payload = {
            title: document.getElementById('title').value.trim(),
            description: document.getElementById('description').value.trim(),
            status: document.getElementById('status').value
          };
          const r = await DemoApi.apiFetch('/api/courses', { method: 'POST', body: JSON.stringify(payload) });
          createOut.textContent = JSON.stringify(r, null, 2);
          await refresh();
        } catch (e) {
          createOut.textContent = JSON.stringify({ error: e.message, status: e.status, payload: e.payload }, null, 2);
        }
      });

      await refresh();
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
