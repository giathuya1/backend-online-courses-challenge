<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instructor - Classes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div id="app-navbar"></div>

  <main class="container py-4 app-shell">
    <div class="page-title mb-3">
      <div>
        <h1 class="h3">Classes</h1>
        <div class="text-muted">Create & manage classes (instructor/admin)</div>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary" href="/dashboard.html">Dashboard</a>
        <button id="btnRefresh" class="btn btn-primary">Refresh</button>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-5">
        <div class="card card-soft">
          <div class="card-header fw-semibold">Create class</div>
          <div class="card-body">
            <div class="mb-2">
              <label class="form-label" for="course_id">Course ID</label>
              <input id="course_id" class="form-control" placeholder="e.g. 1" />
            </div>
            <div class="mb-2">
              <label class="form-label" for="class_name">Class name</label>
              <input id="class_name" class="form-control" value="Batch Demo" />
            </div>
            <div class="mb-2">
              <label class="form-label" for="start_date">Start date</label>
              <input id="start_date" class="form-control" placeholder="YYYY-MM-DD" value="2026-06-10" />
            </div>
            <div class="mb-2">
              <label class="form-label" for="end_date">End date</label>
              <input id="end_date" class="form-control" placeholder="YYYY-MM-DD" value="2026-06-30" />
            </div>
            <div class="mb-2">
              <label class="form-label" for="max_students">Max students</label>
              <input id="max_students" class="form-control" value="30" />
            </div>

            <button id="btnCreate" class="btn btn-dark">Create</button>
            <pre id="createOut" class="bg-light p-3 rounded small mt-3 mb-0"></pre>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card card-soft">
          <div class="card-header fw-semibold">List classes</div>
          <div class="card-body">
            <div id="list" class="table-responsive"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async function () {
      await DemoUI.mountNavbar();
      await DemoUI.requireRole(['instructor', 'admin']);

      const list = document.getElementById('list');
      const createOut = document.getElementById('createOut');

      async function refresh() {
        list.innerHTML = '<div class="text-muted">Loading...</div>';
        const r = await DemoApi.apiFetch('/api/classes?page=1&limit=50', { method: 'GET' });
        const items = r?.data?.classes || [];

        const rows = items.map(c => `
          <tr>
            <td class="mono">${c.id}</td>
            <td>${c.class_name || c.className || ''}</td>
            <td class="mono">${c.course_id}</td>
            <td class="text-muted small">${String(c.start_date || '').slice(0, 10)} → ${String(c.end_date || '').slice(0, 10)}</td>
          </tr>
        `).join('');

        list.innerHTML = `
          <table class="table table-sm align-middle">
            <thead><tr><th>ID</th><th>Name</th><th>Course</th><th>Dates</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4" class="text-muted">No data</td></tr>'}</tbody>
          </table>`;
      }

      document.getElementById('btnRefresh').addEventListener('click', () => refresh().catch(console.error));

      document.getElementById('btnCreate').addEventListener('click', async () => {
        createOut.textContent = 'Creating...';
        try {
          const payload = {
            course_id: parseInt(document.getElementById('course_id').value, 10),
            class_name: document.getElementById('class_name').value.trim(),
            start_date: document.getElementById('start_date').value.trim(),
            end_date: document.getElementById('end_date').value.trim(),
            max_students: parseInt(document.getElementById('max_students').value, 10)
          };

          const r = await DemoApi.apiFetch('/api/classes', { method: 'POST', body: JSON.stringify(payload) });
          createOut.textContent = JSON.stringify(r, null, 2);
          await refresh();
        } catch (e) {
          createOut.textContent = JSON.stringify({ error: e.message, status: e.status, payload: e.payload }, null, 2);
        }
      });

      await refresh();
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
