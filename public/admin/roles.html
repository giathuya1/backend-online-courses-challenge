<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Roles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div id="app-navbar"></div>

  <main class="container py-4 app-shell">
    <div class="page-title mb-3">
      <div>
        <h1 class="h3">Roles</h1>
        <div class="text-muted">Admin-only role management</div>
      </div>
      <a class="btn btn-outline-secondary" href="/dashboard.html">Dashboard</a>
    </div>

    <div class="row g-3">
      <div class="col-lg-6">
        <div class="card card-soft">
          <div class="card-header fw-semibold">List roles</div>
          <div class="card-body">
            <button id="btnLoad" class="btn btn-primary btn-sm">Load</button>
            <pre id="out" class="bg-light p-3 rounded small mt-3 mb-0" style="min-height:140px;"></pre>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card card-soft">
          <div class="card-header fw-semibold">Assign role</div>
          <div class="card-body">
            <div class="mb-2">
              <label for="user_id" class="form-label">User ID</label>
              <input id="user_id" class="form-control" placeholder="e.g. 1" />
            </div>

            <div class="mb-2">
              <label for="role" class="form-label">Role</label>
              <select id="role" class="form-select" title="Role">
                <option value="admin">admin</option>
                <option value="instructor">instructor</option>
                <option value="student">student</option>
              </select>
            </div>

            <button id="btnAssign" class="btn btn-dark btn-sm">Assign</button>
            <pre id="assignOut" class="bg-light p-3 rounded small mt-3 mb-0" style="min-height:140px;"></pre>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async function () {
      await DemoUI.mountNavbar();
      await DemoUI.requireRole(['admin']);

      const out = document.getElementById('out');
      const assignOut = document.getElementById('assignOut');

      document.getElementById('btnLoad').addEventListener('click', async () => {
        out.textContent = 'Loading...';
        try {
          const r = await DemoApi.apiFetch('/api/roles', { method: 'GET' });
          out.textContent = JSON.stringify(r, null, 2);
        } catch (e) {
          out.textContent = JSON.stringify({ error: e.message, status: e.status, payload: e.payload }, null, 2);
        }
      });

      document.getElementById('btnAssign').addEventListener('click', async () => {
        assignOut.textContent = 'Assigning...';
        try {
          const user_id = parseInt(document.getElementById('user_id').value, 10);
          const role = document.getElementById('role').value;

          const r = await DemoApi.apiFetch('/api/roles/assign', {
            method: 'POST',
            body: JSON.stringify({ user_id, role })
          });
          assignOut.textContent = JSON.stringify(r, null, 2);
        } catch (e) {
          assignOut.textContent = JSON.stringify({ error: e.message, status: e.status, payload: e.payload }, null, 2);
        }
      });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
