<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Online Learning System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .form-container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 450px;
      width: 100%;
    }
    h1 { margin-bottom: 30px; color: #333; text-align: center; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #555; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s ease;
    }
    input:focus { outline: none; border-color: #667eea; }
    button {
      width: 100%;
      padding: 12px;
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover { background-color: #0b7dda; }
    .error {
      color: #d32f2f;
      margin-top: 10px;
      padding: 12px;
      background-color: #ffebee;
      border-radius: 8px;
      display: none;
      line-height: 1.6;
    }
    .success {
      color: #388e3c;
      margin-top: 10px;
      padding: 12px;
      background-color: #e8f5e9;
      border-radius: 8px;
      display: none;
      line-height: 1.6;
    }
    .link { text-align: center; margin-top: 20px; }
    .link a { color: #667eea; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>🔐 Login</h1>
    <form id="loginForm">
      <div class="form-group">
        <label>Email or Username</label>
        <input type="text" id="email" required placeholder="your@email.com or username" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="Your password" autocomplete="current-password">
      </div>
      <button type="submit">Login</button>
      <div id="error" class="error"></div>
      <div id="success" class="success"></div>
    </form>

    <div class="link">
      Don't have account? <a href="/register.html">Register here</a>
    </div>
  </div>

  <!-- CSP-safe external script -->
  <script src="/js/login.js" defer></script>
</body>
</html>
