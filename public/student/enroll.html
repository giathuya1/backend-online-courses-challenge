<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student - Enroll</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div id="app-navbar"></div>

  <main class="container py-4 app-shell">
    <div class="page-title mb-3">
      <div>
        <h1 class="h3">Enrollments</h1>
        <div class="text-muted">Enroll into class + view my enrollments</div>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary" href="/dashboard.html">Dashboard</a>
        <button id="btnRefresh" class="btn btn-primary">Refresh</button>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-5">
        <div class="card card-soft">
          <div class="card-header fw-semibold">Enroll into class</div>
          <div class="card-body">
            <div class="mb-2">
              <label class="form-label" for="class_id">Class ID</label>
              <input id="class_id" class="form-control" placeholder="e.g. 1" />
            </div>
            <button id="btnEnroll" class="btn btn-dark">Enroll</button>
            <pre id="enrollOut" class="bg-light p-3 rounded small mt-3 mb-0"></pre>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card card-soft">
          <div class="card-header fw-semibold">My enrollments</div>
          <div class="card-body">
            <div id="list" class="table-responsive"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async function () {
      await DemoUI.mountNavbar();
      await DemoUI.requireRole(['student', 'admin']);

      const list = document.getElementById('list');
      const enrollOut = document.getElementById('enrollOut');

      async function refresh() {
        list.innerHTML = '<div class="text-muted">Loading...</div>';
        const r = await DemoApi.apiFetch('/api/enrollments?page=1&limit=50', { method: 'GET' });
        const items = r?.data?.enrollments || [];

        const rows = items.map(x => `
          <tr>
            <td class="mono">${x.id}</td>
            <td class="mono">${x.class_id}</td>
            <td class="text-muted small">${x.status || ''}</td>
          </tr>
        `).join('');

        list.innerHTML = `
          <table class="table table-sm align-middle">
            <thead><tr><th>ID</th><th>Class</th><th>Status</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="3" class="text-muted">No data</td></tr>'}</tbody>
          </table>`;
      }

      document.getElementById('btnRefresh').addEventListener('click', () => refresh().catch(console.error));

      document.getElementById('btnEnroll').addEventListener('click', async () => {
        enrollOut.textContent = 'Enrolling...';
        try {
          const class_id = parseInt(document.getElementById('class_id').value, 10);
          const r = await DemoApi.apiFetch('/api/enrollments', { method: 'POST', body: JSON.stringify({ class_id }) });
          enrollOut.textContent = JSON.stringify(r, null, 2);
          await refresh();
        } catch (e) {
          enrollOut.textContent = JSON.stringify({ error: e.message, status: e.status, payload: e.payload }, null, 2);
        }
      });

      await refresh();
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
